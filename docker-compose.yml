# Optional: a local PostgreSQL for development.   docker compose up -d
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: canda, POSTGRES_PASSWORD: canda, POSTGRES_DB: canda }
    ports: ["5432:5432"]
    volumes: ["canda_pg:/var/lib/postgresql/data"]
volumes: { canda_pg: {} }
